<html>
  <head>
    <title>Text Indent</title>
    <style>
      h1 { text-indent: 50px; }
      h2 { text-indent: -2em; }
    </style>
  </head>

  <body>
    <h1>This is heading 1. Defines a positive text indent.</h1>
    <h2>This is heading 2. Negative value pulls the text to the left.</h2>
  </body>
</html>
