<html>
  <head>
    <title>Font stretch</title>
    <style>
      p {
        font-stretch: condensed;
      }
    </style>
  </head>
  <body>
    <h1>The font-stretch Property</h1>
    <p>This property has no effect if the selected font does not offer condensed or expanded faces!</p>
  </body>
</html>
